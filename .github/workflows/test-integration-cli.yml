name: Integration test CLI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "cli/**"
      - "openbb_platform/**"
      - "qa/**"
      - ".github/workflows/test-integration-cli.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  integration_cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create repo virtual environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv .venv --python ${{ matrix.python_version }}

      - name: Install OpenBB platform and CLI (editable)
        shell: bash
        run: |
          set -euo pipefail
          ./.venv/bin/python openbb_platform/dev_install.py -e --cli --bootstrap-installer uv

      - name: Verify repo metadata is unchanged after install
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- openbb_platform/pyproject.toml openbb_platform/poetry.lock cli/pyproject.toml cli/poetry.lock

      - name: Verify no uv lock artifacts were created
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --others --exclude-standard | grep -E '(^|/)uv\.lock$'; then
            echo "Unexpected uv.lock artifact generated." >&2
            exit 1
          fi

      - name: Resolve repo Python
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CMD="$(python qa/scripts/resolve_python.py .)"
          echo "PYTHON_CMD=$PYTHON_CMD" >> "$GITHUB_ENV"

      - name: Verify resolved interpreter points to repo .venv
        shell: bash
        run: |
          set -euo pipefail
          case "$PYTHON_CMD" in
            "$GITHUB_WORKSPACE"/.venv/*) ;;
            *)
              echo "Expected repo .venv interpreter, got $PYTHON_CMD" >&2
              exit 1
              ;;
          esac

      - name: Python preflight
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_CMD" -c "import sys; print(sys.executable)"
          "$PYTHON_CMD" --version
          "$PYTHON_CMD" -m pip install pytest
          "$PYTHON_CMD" -m pytest openbb_platform/tests/test_resolve_python.py -q

      - name: Run CLI integration gate
        shell: pwsh
        run: |
          ./qa/scripts/run_integration_gate.ps1 `
            -RootPath . `
            -RunId "ci_cli_${{ github.run_id }}_${{ matrix.python_version }}" `
            -OutputBaseDir logs/verification `
            -ProviderConfigPath qa/config/provider_tiers.yaml `
            -PythonCommand $env:PYTHON_CMD `
            -SkipPythonIntegration `
            -SkipApiIntegration

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-cli-${{ matrix.python_version }}
          path: logs/verification/**
