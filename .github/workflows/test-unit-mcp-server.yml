name: 🧪 test openbb-mcp-server

on:
  pull_request:
    branches: [develop, main, v5]
    paths:
      - "openbb_platform/extensions/mcp_server/**"
      - "openbb_platform/core/**"
      - "cli/**"
      - ".github/workflows/test-unit-mcp-server.yml"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-openbb-mcp-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: openbb_platform/extensions/mcp_server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip uv

      - name: Build sdist + wheel
        run: uv build --no-sources

      - uses: actions/upload-artifact@v5
        with:
          name: openbb-mcp-server-dist
          path: openbb_platform/extensions/mcp_server/dist/
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint (ruff + ty)
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: openbb_platform/extensions/mcp_server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip uv

      - uses: actions/download-artifact@v5
        with:
          name: openbb-mcp-server-dist
          path: openbb_platform/extensions/mcp_server/dist

      - name: Install dependencies then openbb-mcp-server wheel
        run: |
          uv pip install --system ../../core
          uv pip install --system --no-sources ../../../cli tests/fixtures/openbb_mcp_fixture
          uv pip install --system --no-sources --group dev
          uv pip install --system --no-sources dist/openbb_mcp_server-*.whl

      - name: ruff check
        run: ruff check openbb_mcp_server tests

      - name: ruff format --check
        run: ruff format --check openbb_mcp_server tests

      - name: ty check
        run: ty check openbb_mcp_server

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python_version }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python_version: "3.10" }
          - { os: ubuntu-latest, python_version: "3.11" }
          - { os: ubuntu-latest, python_version: "3.12" }
          - { os: ubuntu-latest, python_version: "3.13" }
          - { os: ubuntu-latest, python_version: "3.14" }
          - { os: macos-latest, python_version: "3.10" }
          - { os: macos-latest, python_version: "3.14" }
          - { os: windows-latest, python_version: "3.10" }
          - { os: windows-latest, python_version: "3.14" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: openbb_platform/extensions/mcp_server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true

      - uses: actions/download-artifact@v5
        with:
          name: openbb-mcp-server-dist
          path: openbb_platform/extensions/mcp_server/dist

      - run: python -m pip install --upgrade pip uv

      - name: Install dependencies then openbb-mcp-server wheel
        run: |
          uv pip install --system ../../core
          uv pip install --system --no-sources ../../../cli tests/fixtures/openbb_mcp_fixture
          uv pip install --system --no-sources --group dev
          uv pip install --system --no-sources dist/openbb_mcp_server-*.whl

      - name: Test the installed wheel
        run: |
          rm -rf openbb_mcp_server
          pytest tests --cov=openbb_mcp_server --cov-branch --cov-report=term-missing --cov-fail-under=100
