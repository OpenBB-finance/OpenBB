name: 🚉 Unit test Platform

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'openbb_platform/**'
      - '.github/scripts/noxfile.py'
      - '.github/workflows/test-unit-platform.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
        fail-fast: false

        matrix:
          python_version:
            ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
            python-version: ${{ matrix.python_version }}
            allow-prereleases: true
            cache: "pip"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python_version }}-${{ hashFiles('openbb_platform/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          uv tool run --from nox nox -f .github/scripts/noxfile.py -s unit_test_platform --python ${{ matrix.python_version }}

      - name: Verify repo metadata is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- openbb_platform/pyproject.toml openbb_platform/poetry.lock cli/pyproject.toml cli/poetry.lock

      - name: Verify no uv lock artifacts were created
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --others --exclude-standard | grep -E '(^|/)uv\.lock$'; then
            echo "Unexpected uv.lock artifact generated." >&2
            exit 1
          fi
