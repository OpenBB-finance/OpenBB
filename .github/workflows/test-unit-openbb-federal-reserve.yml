name: 🧪 test openbb-federal-reserve


on:
  pull_request:
    branches: [develop, main, v5]
    paths:
      - "openbb_platform/providers/federal_reserve/**"
      - ".github/workflows/test-unit-openbb-federal-reserve.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel in-flight matrix runs when a new commit lands on the same PR.
  group: test-openbb-federal-reserve-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: openbb_platform/providers/federal_reserve
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip uv

      - name: Build sdist + wheel
        run: uv build --no-sources

      - uses: actions/upload-artifact@v5
        with:
          name: openbb-federal-reserve-dist
          path: openbb_platform/providers/federal_reserve/dist/
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint (ruff + ty)
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: openbb_platform/providers/federal_reserve
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip uv

      - uses: actions/download-artifact@v5
        with:
          name: openbb-federal-reserve-dist
          path: openbb_platform/providers/federal_reserve/dist

      - name: Install dependencies then openbb-federal-reserve wheel
        run: |
          uv pip install --system ../../core
          uv pip install --system --group dev
          uv pip install --system dist/openbb_federal_reserve-*.whl

      - name: ruff check
        run: ruff check openbb_federal_reserve tests

      - name: ruff format --check
        run: ruff format --check openbb_federal_reserve tests

      - name: ty check
        run: ty check openbb_federal_reserve

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python_version }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python_version: "3.10" }
          - { os: ubuntu-latest, python_version: "3.11" }
          - { os: ubuntu-latest, python_version: "3.12" }
          - { os: ubuntu-latest, python_version: "3.13" }
          - { os: ubuntu-latest, python_version: "3.14" }
          - { os: macos-latest, python_version: "3.10" }
          - { os: macos-latest, python_version: "3.14" }
          - { os: windows-latest, python_version: "3.10" }
          - { os: windows-latest, python_version: "3.14" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: openbb_platform/providers/federal_reserve
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true

      - uses: actions/download-artifact@v5
        with:
          name: openbb-federal-reserve-dist
          path: openbb_platform/providers/federal_reserve/dist

      - run: python -m pip install --upgrade pip uv

      - name: Install dependencies then openbb-federal-reserve wheel
        run: |
          uv pip install --system ../../core
          uv pip install --system --group dev
          uv pip install --system dist/openbb_federal_reserve-*.whl

      - name: Test the installed wheel
        # Remove the local ``openbb_federal_reserve/`` source so pytest imports the
        # package from site-packages — the EXACT wheel that would ship to PyPI —
        # rather than letting the source tree shadow the built artifact.
        run: |
          rm -rf openbb_federal_reserve
          pytest tests --cov=openbb_federal_reserve --cov-report=term-missing --cov-fail-under=100
