name: Test pywry

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'pywry/**'
      - '.github/workflows/test-pywry.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'pywry/**'
      - '.github/workflows/test-pywry.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: pywry

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pywry/pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: |
          ruff check pywry/ tests/

      - name: Run Ruff formatter check
        run: |
          ruff format --check pywry/ tests/

      - name: Run Mypy type checker
        run: |
          mypy pywry/

      - name: Run Pylint
        run: |
          pylint pywry/ --exit-zero --output-format=colorized

  test:
    name: Test - ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 platforms: test min (3.10) and max (3.14)
          - os: ubuntu-24.04
            python-version: '3.10'
          - os: ubuntu-24.04
            python-version: '3.14'
          - os: windows-2025
            python-version: '3.10'
          - os: windows-2025
            python-version: '3.14'
          - os: macos-15-intel
            python-version: '3.10'
          - os: macos-15-intel
            python-version: '3.14'
          # ARM platforms: test min available and max (3.14)
          - os: ubuntu-24.04-arm
            python-version: '3.11'
          - os: ubuntu-24.04-arm
            python-version: '3.14'
          - os: windows-11-arm
            python-version: '3.12'
          - os: windows-11-arm
            python-version: '3.14'
          - os: macos-15
            python-version: '3.10'
          - os: macos-15
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pywry/pyproject.toml'

      - name: Set up Rust (Linux only)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      # Linux: Install Xvfb and other dependencies for GUI tests
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 15; done
          for i in 1 2 3; do sudo apt-get install -y --fix-missing xvfb dbus-x11 at-spi2-core libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libgl1 libegl1 libwebkit2gtk-4.1-dev libgtk-3-dev && break || { sleep 30; sudo apt-get update; }; done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          PYWRY_HEADLESS: "1"
          NO_AT_BRIDGE: "1"
        run: |
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -m pytest tests/ -v --tb=short

      # Windows: Run tests
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        env:
          PYWRY_HEADLESS: "1"
        run: |
          python -m pytest tests/ -v --tb=short

      # macOS: Run tests
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        env:
          PYWRY_HEADLESS: "1"
        run: |
          python -m pytest tests/ -v --tb=short

  # Redis integration tests - runs on Linux with Redis service container
  test-redis:
    name: Redis Integration Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pywry/pyproject.toml'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 15; done
          for i in 1 2 3; do sudo apt-get install -y --fix-missing xvfb dbus-x11 at-spi2-core libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libgl1 libegl1 libwebkit2gtk-4.1-dev libgtk-3-dev redis-tools && break || { sleep 30; sudo apt-get update; }; done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping > /dev/null 2>&1; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 1
          done

      - name: Run Redis integration tests
        env:
          PYWRY_HEADLESS: "1"
          NO_AT_BRIDGE: "1"
          PYWRY_DEPLOY__STATE_BACKEND: "redis"
          PYWRY_DEPLOY__REDIS_URL: "redis://localhost:6379/0"
          PYWRY_DEPLOY__REDIS_PREFIX: "pywry-ci:"
        run: |
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python -m pytest tests/test_state_redis_integration.py tests/test_state_redis.py -v --tb=short
