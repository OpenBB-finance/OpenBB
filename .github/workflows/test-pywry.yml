name: Test pywry

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'pywry/**'
      - '.github/workflows/test-pywry.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'pywry/**'
      - '.github/workflows/test-pywry.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: pywry

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pywry/pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: |
          ruff check pywry/ tests/

      - name: Run Ruff formatter check
        run: |
          ruff format --check pywry/ tests/

      - name: Run Mypy type checker
        run: |
          mypy pywry/

      - name: Run Pylint
        run: |
          pylint pywry/ --exit-zero --output-format=colorized

  test:
    name: Test - ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 platforms: test min (3.10) and max (3.14)
          - os: ubuntu-24.04
            python-version: '3.10'
          - os: ubuntu-24.04
            python-version: '3.14'
          - os: windows-2025
            python-version: '3.10'
          - os: windows-2025
            python-version: '3.14'
          - os: macos-15-intel
            python-version: '3.10'
          - os: macos-15-intel
            python-version: '3.14'
          # ARM platforms: test min available and max (3.14)
          - os: ubuntu-24.04-arm
            python-version: '3.11'
          - os: ubuntu-24.04-arm
            python-version: '3.14'
          - os: windows-11-arm
            python-version: '3.12'
          - os: windows-11-arm
            python-version: '3.14'
          - os: macos-15
            python-version: '3.10'
          - os: macos-15
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pywry/pyproject.toml'

      - name: Set up Rust (Linux only)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      # Linux: Install Xvfb and other dependencies for GUI tests
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 15; done
          for i in 1 2 3; do sudo apt-get install -y --fix-missing xvfb dbus-x11 at-spi2-core libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libgl1 libegl1 libwebkit2gtk-4.1-dev libgtk-3-dev && break || { sleep 30; sudo apt-get update; }; done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Verify Docker is available for testcontainers (Linux only)
      - name: Verify Docker for testcontainers (Linux)
        if: runner.os == 'Linux'
        run: |
          docker version
          docker info
          echo "Docker socket: $(ls -la /var/run/docker.sock)"

      # Windows: Install Docker
      - name: Install Docker (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install docker-desktop -y --no-progress
          & "C:\Program Files\Docker\Docker\Docker Desktop.exe"
          $timeout = 300
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              docker version
              Write-Host "Docker is ready!"
              break
            } catch {
              Write-Host "Waiting for Docker to start... ($elapsed s)"
              Start-Sleep -Seconds 10
              $elapsed += 10
            }
          }
          if ($elapsed -ge $timeout) {
            Write-Host "Docker failed to start within timeout"
            exit 1
          }

      # macOS: Install and start Docker via colima (lightweight Docker runtime)
      - name: Install Docker (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install docker colima
          colima start --cpu 2 --memory 4 --disk 10
          # Wait for Docker to be ready
          for i in {1..30}; do
            if docker version &>/dev/null; then
              echo "Docker is ready!"
              break
            fi
            echo "Waiting for Docker to start... ($i)"
            sleep 5
          done
          docker version
          docker info

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          PYWRY_HEADLESS: "1"
          NO_AT_BRIDGE: "1"
          DOCKER_HOST: "unix:///var/run/docker.sock"
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "/var/run/docker.sock"
        run: |
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -m pytest tests/ -v --tb=short

      # Windows: Run ALL tests
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        env:
          PYWRY_HEADLESS: "1"
        run: |
          python -m pytest tests/ -v --tb=short

      # macOS: Run ALL tests
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        env:
          PYWRY_HEADLESS: "1"
          DOCKER_HOST: "unix://$HOME/.colima/default/docker.sock"
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "$HOME/.colima/default/docker.sock"
        run: |
          python -m pytest tests/ -v --tb=short

