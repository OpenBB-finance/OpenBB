name: 🧪 test openbb-deribit

on:
  pull_request:
    branches: [develop, main, v5]
    paths:
      - "openbb_platform/providers/deribit/**"
      - ".github/workflows/test-unit-openbb-deribit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-openbb-deribit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: openbb_platform/providers/deribit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip uv

      - name: Build sdist + wheel
        run: uv build --no-sources

      - uses: actions/upload-artifact@v4
        with:
          name: openbb-deribit-dist
          path: openbb_platform/providers/deribit/dist/
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint (ruff + ty)
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: openbb_platform/providers/deribit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip uv

      - name: Install openbb-deribit in editable mode with the dev group
        run: uv pip install --system -e . --group dev

      - name: ruff check
        run: ruff check --no-fix openbb_deribit tests integration

      - name: ruff format --check
        run: ruff format --check openbb_deribit tests integration

      - name: ty check
        run: ty check openbb_deribit

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python_version }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python_version: "3.10" }
          - { os: ubuntu-latest, python_version: "3.11" }
          - { os: ubuntu-latest, python_version: "3.12" }
          - { os: ubuntu-latest, python_version: "3.13" }
          - { os: ubuntu-latest, python_version: "3.14" }
          - { os: macos-latest, python_version: "3.10" }
          - { os: macos-latest, python_version: "3.14" }
          - { os: windows-latest, python_version: "3.10" }
          - { os: windows-latest, python_version: "3.14" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: openbb_platform/providers/deribit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true

      - uses: actions/download-artifact@v4
        with:
          name: openbb-deribit-dist
          path: openbb_platform/providers/deribit/dist

      - run: python -m pip install --upgrade pip uv

      - name: Install the dev group then the openbb-deribit wheel
        run: |
          uv pip install --system --group dev
          uv pip install --system dist/openbb_deribit-*.whl

      - name: Test the installed wheel
        run: |
          rm -rf openbb_deribit
          pytest tests --cov=openbb_deribit --cov-report=term-missing --cov-fail-under=100
