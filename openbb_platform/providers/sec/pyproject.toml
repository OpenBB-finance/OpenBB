[project]
name = "openbb-sec"
version = "2.0.0"
description = "SEC provider extension for OpenBB Platform."
authors = [{ name = "OpenBB Team", email = "hello@openbb.co" }]
license = { text = "AGPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "openbb-core[pandas]>=2.0.0",
    "openbb-platform-api>=1.3.6",
    "fastmcp>=3.2.0",
    "diskcache>=5.6.3",
    "defusedxml>=0.7.1",
    "xmltodict>=0.13.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2.1",
]

[project.scripts]
openbb-sec = "openbb_sec.cli:main"

[project.entry-points."openbb_provider_extension"]
sec = "openbb_sec:sec_provider"

[project.entry-points."openbb_core_extension"]
sec = "openbb_sec.sec_router:router"

[project.urls]
Homepage = "https://openbb.co"
Repository = "https://github.com/OpenBB-finance/OpenBB"

[dependency-groups]
dev = ["openbb-devtools>=2.0.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_sec"]

[tool.hatch.build.targets.sdist]
include = [
    "openbb_sec",
    "README.md",
    "pyproject.toml",
]

[tool.uv]
override-dependencies = ["openbb-core[pandas] @ ${PROJECT_ROOT}/../../core"]

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }
openbb-platform-api = { path = "../../extensions/platform_api", editable = true }
openbb-devtools = { path = "../../extensions/devtools", editable = true }

[tool.ruff]
line-length = 88
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["D", "E", "W", "F", "S", "UP", "I", "PLC", "PLE", "PLR", "PLW", "SIM", "T20"]
ignore = [
    "PLR2004", "PLR0913", "PLR0915", "PLC0415",
    "E402", "E501",
    "D202", "D203", "D205", "D206", "D210", "D212", "D213", "D214",
    "D215", "D300", "D400", "D404", "D405", "D406", "D407", "D408",
    "D409", "D410", "D411", "D413", "D415", "D416", "D417",
]

[tool.ruff.lint.per-file-ignores]
"openbb_sec/cli.py" = ["T201", "S404", "S603", "PLC0415"]
"openbb_sec/sec_router.py" = ["ARG001", "PLC0415", "SLF001"]
"openbb_sec/models/*.py" = ["ARG002", "PLC0415", "PLR0911", "PLR0912", "PLR0914", "PLR0915", "PLR0917"]
"openbb_sec/utils/*.py" = ["PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917", "SLF001", "BLE001"]
"openbb_sec/utils/statement_schema/*.py" = ["PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917", "SLF001", "BLE001", "B023"]
"tests/**" = ["S101", "S108", "D", "SIM105", "SIM117", "T201", "PLC0415"]
"integration/**" = ["S101", "S108", "D", "SIM105", "SIM117", "PLC0415", "ARG001"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty]
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["openbb_sec"]
exclude = ["tests", "integration"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "record_http: VCR-backed HTTP cassette tests",
    "integration: live integration tests against the SEC API",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:openbb_core.provider.utils.client",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
    "ignore:The behavior of DataFrame concatenation with empty or all-NA entries is deprecated:FutureWarning",
]
