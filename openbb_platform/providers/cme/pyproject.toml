[tool.poetry]
name = "openbb-cme"
version = "1.0.0"
description = "CME Group provider for OpenBB — equity index futures settlement data."
authors = ["OpenBB Team <hello@openbb.co>"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_cme" }]

[tool.poetry.dependencies]
python = ">=3.10,<4"
openbb-core = "^1.6.10"
curl-cffi = ">=0.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_provider_extension"]
cme = "openbb_cme:cme_provider"
