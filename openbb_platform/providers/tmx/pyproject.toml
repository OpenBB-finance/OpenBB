[project]
name = "openbb-tmx"
version = "2.0.0"
description = "Unofficial TMX data provider extension for the OpenBB Platform - Public Canadian markets data for Python and Fast API."
authors = [{ name = "OpenBB Team", email = "hello@openbb.co" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "openbb-core[pandas]>=2.0.0",
    "aiohttp-client-cache>=0.11",
    "aiosqlite>=0.20",
    "curl-cffi>=0.7",
    "diskcache>=5.6",
    "lxml>=5.0",
    "pyarrow>=16.0",
    "tzdata>=2024.1",
    "random-user-agent>=1.0.1",
    "exchange-calendars>=4.13.2",
    "python-dateutil>=2.8",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
charting = ["openbb-charting>=3.0.0"]
builder = ["pywry>=2.0.0"]
all = ["openbb-charting>=3.0.0", "pywry>=2.0.0"]

[project.entry-points."openbb_provider_extension"]
tmx = "openbb_tmx:tmx_provider"

[project.entry-points."openbb_core_extension"]
tmx = "openbb_tmx.tmx_router:router"

[project.urls]
Homepage = "https://openbb.co"
Repository = "https://github.com/OpenBB-finance/OpenBB"

[dependency-groups]
dev = [
    "openbb-devtools>=2.0.0",
    "openbb-platform-api>=2.0.0",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_tmx"]

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }
openbb-devtools = { path = "../../extensions/devtools", editable = true }
openbb-charting = { path = "../../obbject_extensions/charting", editable = true }
openbb-platform-api = { path = "../../extensions/platform_api", editable = true }

[tool.ruff]
line-length = 88
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["D", "E", "W", "F", "S", "UP", "I", "PLC", "PLE", "PLR", "PLW", "SIM", "T20"]
ignore = [
    "PLR2004", "PLR0913", "PLR0915", "PLC0415",
    "E402", "E501",
    "D202", "D203", "D205", "D206", "D210", "D212", "D213", "D214",
    "D215", "D300", "D400", "D404", "D405", "D406", "D407", "D408",
    "D409", "D410", "D411", "D413", "D415", "D416", "D417",
]

[tool.ruff.lint.per-file-ignores]
"openbb_tmx/routers/*.py" = ["ARG001", "PLC0415", "PLR0913", "PLR0917"]
"openbb_tmx/models/*.py" = ["ARG002", "PLC0415", "PLR0911", "PLR0912", "PLR0914"]
"openbb_tmx/utils/*.py" = ["ARG001", "PLR0912"]
"tests/**" = ["S101", "S108", "D", "SIM105", "SIM117"]
"integration/**" = ["S101", "S108", "D", "SIM105", "SIM117", "PLC0415", "ARG001"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty]
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["openbb_tmx"]
exclude = ["tests", "integration"]

[tool.ty.rules]
unresolved-import = "warn"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "record_http: VCR-backed HTTP cassette tests",
    "integration: end-to-end tests that hit live services (excluded from the coverage gate)",
]
