[tool.poetry]
name = "openbb-arkleon"
version = "0.1.0"
description = "Arkleon extension for OpenBB"
authors = ["Arkleon <founder@arkleon.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "openbb_arkleon" }]

[tool.poetry.dependencies]
python = ">=3.10,<4"
openbb-core = "^1.6.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_provider_extension"]
arkleon = "openbb_arkleon:arkleon_provider"
