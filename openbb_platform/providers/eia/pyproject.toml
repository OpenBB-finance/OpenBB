[project]
name = "openbb-us-eia"
version = "2.0.0"
description = "U.S. Energy Information Administration (EIA) provider extension for OpenBB Platform."
authors = [{ name = "OpenBB Team", email = "hello@openbb.co" }]
license = { text = "AGPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "openbb-core[pandas]>=2.0.0",
    "async-lru>=2",
    "curl-cffi>=0.7",
    "feedparser>=6.0",
    "openpyxl>=3.1.5",
    "requests>=2.31",
    "xlrd>=2.0.1",
]

[project.scripts]
generate-eia-catalog = "openbb_us_eia.utils.generate_catalog:main"

[project.entry-points."openbb_provider_extension"]
us_eia = "openbb_us_eia:eia_provider"

[project.entry-points."openbb_core_extension"]
eia = "openbb_us_eia.eia_router:router"

[project.urls]
Homepage = "https://openbb.co"
Repository = "https://github.com/OpenBB-finance/OpenBB"

[dependency-groups]
dev = ["openbb-devtools>=2.0.0", "openbb-platform-api>=2.0.0"]

[build-system]
requires = ["hatchling>=1.25", "requests>=2.31"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_us_eia"]

[tool.hatch.build.targets.sdist]
include = [
    "openbb_us_eia",
    "openbb_us_eia/assets/eia_catalog.json.xz",
    "hatch_build.py",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }
openbb-devtools = { path = "../../extensions/devtools", editable = true }
openbb-platform-api = { path = "../../extensions/platform_api", editable = true }

[tool.ruff]
line-length = 88
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["D", "E", "W", "F", "S", "UP", "I", "PLC", "PLE", "PLR", "PLW", "SIM", "T20"]
ignore = [
    "PLR2004", "PLR0913", "PLR0915", "PLC0415",
    "E402", "E501",
    "D202", "D203", "D205", "D206", "D210", "D212", "D213", "D214",
    "D215", "D300", "D400", "D404", "D405", "D406", "D407", "D408",
    "D409", "D410", "D411", "D413", "D415", "D416", "D417",
]

[tool.ruff.lint.per-file-ignores]
"openbb_us_eia/eia_router.py" = ["ARG001", "PLR0912"]
"openbb_us_eia/models/*.py" = ["ARG002", "PLR0912"]
"openbb_us_eia/utils/generate_catalog.py" = ["S310", "PLR0912", "PLR0914"]
"tests/**" = ["S101", "S108", "D", "SIM105", "SIM117"]
"integration/**" = ["S101", "S108", "D", "SIM105", "SIM117", "PLC0415", "ARG001"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["openbb_us_eia"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty]
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["openbb_us_eia"]
exclude = ["tests", "integration"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "record_http: VCR-backed HTTP cassette tests",
    "integration: live integration tests against the EIA API",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:openbb_core.provider.utils.client",
    "ignore::async_lru.AlruCacheLoopResetWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
