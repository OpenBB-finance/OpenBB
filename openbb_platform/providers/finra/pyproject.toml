[project]
name = "openbb-finra"
version = "2.0.0"
description = "FINRA provider extension for OpenBB Platform."
authors = [{ name = "OpenBB Team", email = "hello@openbb.co" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "openbb-core[pandas]>=2.0.0",
]

[project.scripts]
generate-finra-security-types = "openbb_finra.utils.generate_securities:main"

[project.entry-points."openbb_provider_extension"]
finra = "openbb_finra:finra_provider"

[project.entry-points."openbb_core_extension"]
finra = "openbb_finra.finra_router:router"

[project.urls]
Homepage = "https://openbb.co"
Repository = "https://github.com/OpenBB-finance/OpenBB"

[dependency-groups]
dev = ["openbb-devtools>=2.0.1", "openbb-platform-api>=2.0.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_finra"]
exclude = ["openbb_finra/scripts"]

[tool.hatch.build.targets.sdist]
exclude = ["openbb_finra/scripts"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }
openbb-devtools = { path = "../../extensions/devtools", editable = true }
openbb-platform-api = { path = "../../extensions/platform_api", editable = true }

[tool.ruff]
line-length = 88
target-version = "py310"
fix = true
extend-exclude = ["openbb_finra/scripts"]

[tool.ruff.lint]
select = ["D", "E", "W", "F", "S", "UP", "I", "PLC", "PLE", "PLR", "PLW", "SIM", "T20"]
ignore = [
    "PLR2004", "PLR0913", "PLR0915", "PLC0415",
    "E402", "E501",
    "D202", "D203", "D205", "D206", "D210", "D212", "D213", "D214",
    "D215", "D300", "D400", "D404", "D405", "D406", "D407", "D408",
    "D409", "D410", "D411", "D413", "D415", "D416", "D417",
]

[tool.ruff.lint.per-file-ignores]
"openbb_finra/routers/*.py" = ["ARG001", "PLC0415", "PLR0913", "PLR0917"]
"openbb_finra/models/*.py" = ["ARG002", "PLC0415", "PLR0912"]
"openbb_finra/utils/*.py" = ["ARG001", "PLR0912"]
"tests/**" = ["S101", "S108", "D", "SIM105", "SIM117"]
"integration/**" = ["S101", "S108", "D", "SIM105", "SIM117", "PLC0415", "ARG001"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty]
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["openbb_finra"]
exclude = ["tests", "integration", "openbb_finra/scripts"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.coverage.run]
source = ["openbb_finra"]
omit = ["*/openbb_finra/scripts/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests that hit live services (excluded from the coverage gate)",
]
filterwarnings = [
    "error",
    "default::coverage.exceptions.CoverageWarning",
    "default::pytest_cov.plugin.PytestCovWarning",
    "ignore::DeprecationWarning:openbb_core.provider.utils.client",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
