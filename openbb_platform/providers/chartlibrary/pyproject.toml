[tool.poetry]
name = "openbb-chartlibrary"
version = "1.6.1"
description = "ChartLibrary Provider for OpenBB Platform"
authors = ["OpenBB Team <hello@openbb.co>"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_chartlibrary" }]

[tool.poetry.dependencies]
python = ">=3.10,<4"
openbb-core = "^1.6.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_provider_extension"]
chartlibrary = "openbb_chartlibrary:chartlibrary_provider"
