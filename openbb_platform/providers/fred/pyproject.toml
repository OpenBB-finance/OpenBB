[project]
name = "openbb-fred"
version = "2.0.0"
description = "FRED provider extension for OpenBB Platform."
authors = [{ name = "OpenBB Team", email = "hello@openbb.co" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "openbb-core[pandas]>=2.0.0",
    "diskcache>=5.6",
]

[project.scripts]
generate-fred-release-map = "openbb_fred.utils.generate_release_map:main"

[project.entry-points."openbb_provider_extension"]
fred = "openbb_fred:fred_provider"

[project.entry-points."openbb_core_extension"]
fred = "openbb_fred.fred_router:router"

[project.urls]
Homepage = "https://openbb.co"
Repository = "https://github.com/OpenBB-finance/OpenBB"

[dependency-groups]
dev = ["openbb-devtools>=2.0.1", "pytest-socket>=0.7"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_fred"]

[tool.uv.sources]
openbb-core = { path = "../../core", editable = true }
openbb-devtools = { path = "../../extensions/devtools", editable = true }

[tool.ruff]
line-length = 88
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["D", "E", "W", "F", "S", "UP", "I", "PLC", "PLE", "PLR", "PLW", "SIM", "T20"]
ignore = [
    "PLR2004", "PLR0913", "PLR0915", "PLC0415",
    "E402", "E501",
    "D202", "D203", "D205", "D206", "D210", "D212", "D213", "D214",
    "D215", "D300", "D400", "D404", "D405", "D406", "D407", "D408",
    "D409", "D410", "D411", "D413", "D415", "D416", "D417",
]

[tool.ruff.lint.per-file-ignores]
"openbb_fred/routers/*.py" = ["ARG001", "PLC0415", "PLR0913", "PLR0917"]
"openbb_fred/models/*.py" = ["ARG002", "PLC0415", "PLR0911", "PLR0912", "PLR0914"]
"openbb_fred/utils/*.py" = ["ARG001", "PLR0912", "PLW0603"]
"openbb_fred/utils/generate_release_map.py" = ["T201", "PLW0108"]
"tests/**" = ["S101", "S108", "D", "SIM105", "SIM117"]
"integration/**" = ["S101", "S108", "D", "SIM105", "SIM117", "PLC0415", "ARG001"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty]
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["openbb_fred"]
exclude = ["tests", "integration"]

[tool.ty.rules]
unresolved-import = "warn"

[tool.coverage.run]
branch = true
source = ["openbb_fred"]

[tool.coverage.report]
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
markers = [
    "record_http: VCR-backed HTTP cassette tests",
    "integration: end-to-end tests that hit live services (excluded from the coverage gate)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:openbb_core.provider.utils.client",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
