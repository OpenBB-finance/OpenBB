version: "v1"
mode: "global_unified"
missing_data_policy: "strict_exclude"
legacy_universe_policy:
  mode: "deprecate_one_release"
  sunset_date: "2026-06-30"
  replacement_id: "global_core_equity"

u0_filters:
  allowed_security_types:
    - "common_stock"
  excluded_security_types:
    - "etf"
    - "etn"
    - "mutual_fund"
    - "closed_end_fund"
    - "adr"
    - "dr"
    - "spac"
    - "lp"
    - "mlp"
    - "bdc"
    - "preferred"
    - "rights"
    - "warrant"
    - "convertible"
    - "tracking_stock"
  major_exchanges:
    - "NYSE"
    - "NASDAQ"
    - "KOSPI"
    - "KOSDAQ"
  excluded_exchange_types:
    - "OTC"
    - "PINK"
    - "BULLETIN"
  min_price_20d_avg: 5.0
  min_free_float_ratio: 0.10
  min_float_mcap_usd: 500000000.0
  min_ipo_trading_days: 60

u1_filters:
  min_median_dollar_volume_63d: 5000000.0
  min_trading_frequency_63d: 0.90
  min_annual_turnover_ratio_252d: 0.75

u2_filters:
  max_trading_halt_days: 29
  exclude_management_flag: true
  exclude_delisting_pending_flag: true
  exclude_special_status_flag: true
  exclude_hard_to_borrow_for_long_short: true

asof_policy:
  market_data_cutoff: "T-1_close"
  shares_float_cutoff: "T-1"
  fundamentals_lag_days: 60
  prohibit_future_data: true

rebalance_policy:
  frequency: "monthly"
  decision_time: "month_end"
  cutoff: "T-1"
  execution: "T+1_open"

backtest:
  candidate_cap: 190
  defensive_bucket:
    enabled: true
    floor_mode: "regime"
    floor_low: 0.25
    floor_mid: 0.35
    floor_high: 0.45
    floor_risk_off: 0.55
    floor_fixed: 0.30
    floor_max: 0.80
    risk_off_drawdown_threshold: 0.10
    risk_off_trend_regimes: ["bear"]
    risk_off_vol_regimes: ["high"]
    symbols_defensive_core:
      - "GOVT"
      - "IEF"
      - "TLT"
      - "SHY"
      - "VGSH"
      - "VGIT"
      - "TIP"
      - "MBB"
      - "SGOV"
      - "TFLO"
      - "114470.KS"
      - "148070.KS"
      - "449170.KS"
    symbols_defensive_credit:
      - "LQD"
      - "VCIT"
      - "VCSH"
      - "454780.KS"
    symbols_force_risk:
      - "HYG"
      - "JNK"
      - "SJNK"
      - "EMB"
      - "VCLT"
    credit_cap_abs_weight: 0.15
    allow_u2_override: true
    postcheck:
      enabled: true
      cvar_alpha: 0.05
      cvar_limit: -0.02
      vol_limit: 0.20
      floor_step: 0.05
      max_iterations: 6
      risk_scale_step: 0.85
      risk_scale_min: 0.50

portfolio_constraints:
  target_count: 150
  min_count: 100
  max_count: 200
  max_weight_per_stock: 0.06
  sector_cap: 0.25
  country_cap: 0.35

liquidity_constraints:
  adv_lookback_days: 20
  max_adv_participation: 0.05

risk_constraints:
  max_risk_contribution_per_stock: 0.05
  covariance_lookback_days: 126
  epsilon: 1.0e-9

institutional_mode:
  delisting_require_event: false
