version: "v1"

defaults:
  timezone: "Asia/Seoul"
  run_id_scheme: "compact_v1"
  training_run_id_scheme: "compact_v1"
  pretrain_bootstrap_enabled: true
  stale_timeout_minutes: 90
  heartbeat_interval_sec: 30
  market_data_timeout_sec: 20
  market_data_retry: 2
  market_data_backoff_base: 2.0
  market_data_workers: 10
  market_schedule:
    primary_calendar: "XNYS"
    run_phase: "post_close"
    timezone: "America/New_York"

daily:
  universe_id: "all_in_one"
  lookback_years: 3
  market_delta_days: 45
  feature_delta_days: 120
  max_infer_workers: 8
  market_update_delta_days: 60
  run_id: null
  model_name: "lgbm_ranker"
  top_k: 20
  score_threshold: 0.5
  cost_bps: 10.0
  slippage_bps: 2.0
  entry_price: "next_open"
  exit_price: "close"
  retries: 1
  backoff_sec: 1.0
  compute_features: true
  features_lookback_days: 365
  predict_mode: "infer_only"
  predict_fallback_legacy: true
  shadow_live:
    enabled: true
    submit_orders: false

weekly:
  universe_id: "all_in_one"
  recent_years: 3
  horizon_days: 1
  target_mode: "next_open_to_close"
  include_macro_features: true
  macro_feature_subset: ["z_252", "yoy", "mom_3", "slope"]
  quick_mode: false
  top_liquid_n: 400
  model_choice: "lgbm_only"
  early_stopping: true
  feature_pruning: true
  walk_forward_compact: false
  cross_sectional_sampling: false
  walk_forward_config:
    train_months: 24
    embargo_months: 1
    val_months: 1
    step_months: 3
    purging_mode: "strict_label_overlap"
  ranker_config:
    n_estimators: 2500
    early_stopping_rounds: 80
    stacking_enabled: false
    stacking_alpha: 1.0
  feature_config:
    include_bollinger: true
    include_atr: true
    include_adx: true
    include_obv: true
  hpo_config:
    enabled: true
    n_trials: 8
    timeout_sec: 900
    objective_metric: "val_ic"
    random_state: 42
  training_wait_timeout_sec: 5400
  training_poll_sec: 2.0
  retries: 1
  backoff_sec: 2.0
  compute_features: true
  features_lookback_days: 365
  promote_on_success: true
  promote_thresholds:
    sharpe_min: 0.0
    max_drawdown_min: -0.6
    turnover_max: 4.0
    val_ic_min: -0.05
  non_inferiority_tolerance:
    sharpe: 0.05
    val_ic: 0.01
    max_drawdown: 0.03
    turnover: 0.25

monthly:
  universe_id: "all_in_one"
  recent_years: 5
  horizon_days: 1
  target_mode: "next_open_to_close"
  include_macro_features: true
  macro_feature_subset: ["z_252", "yoy", "mom_3", "slope"]
  quick_mode: false
  top_liquid_n: null
  model_choice: "lgbm_only"
  early_stopping: true
  feature_pruning: true
  walk_forward_compact: false
  cross_sectional_sampling: false
  walk_forward_config:
    train_months: 36
    embargo_months: 1
    val_months: 1
    step_months: 1
    purging_mode: "strict_label_overlap"
  ranker_config:
    n_estimators: 4000
    early_stopping_rounds: 120
    stacking_enabled: true
    stacking_alpha: 1.0
  feature_config:
    include_bollinger: true
    include_atr: true
    include_adx: true
    include_obv: true
  hpo_config:
    enabled: true
    n_trials: 20
    timeout_sec: 2700
    objective_metric: "val_ic"
    random_state: 42
  training_wait_timeout_sec: 21600
  training_poll_sec: 2.0
  retries: 1
  backoff_sec: 2.0
  compute_features: true
  features_lookback_days: 365

retention:
  policy: "keep_all"
  index_compaction: true
