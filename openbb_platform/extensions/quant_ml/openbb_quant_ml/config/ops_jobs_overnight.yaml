version: "v1"

defaults:
  timezone: "Asia/Seoul"
  run_id_scheme: "compact_v1"
  training_run_id_scheme: "compact_v1"
  pretrain_bootstrap_enabled: true
  stale_timeout_minutes: 90
  heartbeat_interval_sec: 30
  market_data_timeout_sec: 20
  market_data_retry: 2
  market_data_backoff_base: 2.0
  market_data_workers: 6

daily:
  universe_id: "all_in_one"
  lookback_years: 3
  market_delta_days: 45
  feature_delta_days: 120
  max_infer_workers: 4
  run_id: null
  model_name: "lgbm_ranker"
  top_k: 20
  score_threshold: 0.5
  cost_bps: 10.0
  slippage_bps: 2.0
  entry_price: "next_open"
  exit_price: "close"
  retries: 1
  backoff_sec: 1.0
  compute_features: true
  features_lookback_days: 365
  predict_mode: "infer_only"
  predict_fallback_legacy: true

weekly:
  universe_id: "all_in_one"
  recent_years: 5
  horizon_days: 1
  target_mode: "next_open_to_close"
  include_macro_features: true
  macro_feature_subset: ["z_252", "yoy", "mom_3", "slope"]
  quick_mode: false
  model_choice: "lgbm_only"
  early_stopping: true
  feature_pruning: true
  walk_forward_compact: false
  cross_sectional_sampling: false
  retries: 1
  backoff_sec: 2.0
  compute_features: true
  features_lookback_days: 365
  promote_on_success: true
  training_wait_timeout_sec: 21600
  training_poll_sec: 2.0
  promote_thresholds:
    sharpe_min: 0.1
    max_drawdown_min: -0.4
    turnover_max: 3.0
    val_ic_min: -1.0

monthly:
  universe_id: "all_in_one"
  recent_years: 5
  horizon_days: 1
  target_mode: "next_open_to_close"
  include_macro_features: true
  macro_feature_subset: ["z_252", "yoy", "mom_3", "slope"]
  quick_mode: false
  model_choice: "lgbm_only"
  early_stopping: true
  feature_pruning: true
  walk_forward_compact: false
  cross_sectional_sampling: false
  retries: 1
  backoff_sec: 2.0
  compute_features: true
  features_lookback_days: 365

retention:
  policy: "keep_all"
  index_compaction: true

overnight_profiles:
  canary:
    defaults:
      stale_timeout_minutes: 90
      heartbeat_interval_sec: 30
      market_data_timeout_sec: 20
      market_data_retry: 2
      market_data_workers: 6
    daily:
      lookback_years: 2
      feature_delta_days: 180
    weekly:
      quick_mode: true
      recent_years: 2
      model_choice: "lgbm_only"
      top_liquid_n: 300
      walk_forward_compact: true
      cross_sectional_sampling: true
      feature_pruning: true
      training_wait_timeout_sec: 5400
      training_poll_sec: 2.0
  full:
    defaults:
      stale_timeout_minutes: 90
      heartbeat_interval_sec: 30
      market_data_timeout_sec: 20
      market_data_retry: 2
      market_data_workers: 6
    weekly:
      quick_mode: false
      recent_years: 5
      model_choice: "lgbm_only"
      top_liquid_n: null
      walk_forward_compact: false
      cross_sectional_sampling: false
      feature_pruning: true
      training_wait_timeout_sec: 21600
      training_poll_sec: 2.0
